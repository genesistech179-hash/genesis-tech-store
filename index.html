<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Genesis Tech Store</title>
<meta name="description" content="Pusat download aplikasi Genesis Tech Store.">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%231457e6%22%2F%3E%3Cpath%20d%3D%22M32%2014v22M21%2027l11%2011%2011-11M18%2048h28%22%20fill%3D%22none%22%20stroke%3D%22%23fff%22%20stroke-width%3D%226%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
:root{color-scheme:light}
img{max-width:100%}
[hidden]{display:none!important}

/* Layout: header kartu yang menempel di atas, banner biru lebar, grid aplikasi 4 kolom, halaman detail berupa satu kartu besar. */
:root{
  --bg:#f1f6ff; --surface:#ffffff; --surface2:#eaf1ff; --fg:#0e1d47; --muted:#5a6a8e; --line:#d9e4fa;
  --link:#1457e6; --btn1:#2a74ff; --btn2:#0f4fdc; --accent:#ffc61a; --accent-fg:#1a2250;
  --navy:#0b1a49; --navy-fg:#dce6ff; --hero1:#0a3bb5; --hero2:#1f78ff;
  --shadow:0 6px 24px rgba(20,60,160,.08); --bad:#c62828;
  --font-display:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#080f2b; --surface:#111b45; --surface2:#182559; --fg:#e8eeff; --muted:#a2b2da; --line:#243570;
    --link:#82aaff; --btn1:#3a7bff; --btn2:#1f5ae8; --navy:#060b20; --hero1:#0a2d8c; --hero2:#1a5fe0;
    --shadow:0 6px 24px rgba(0,0,0,.35); --bad:#ff8a8a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#080f2b; --surface:#111b45; --surface2:#182559; --fg:#e8eeff; --muted:#a2b2da; --line:#243570;
  --link:#82aaff; --btn1:#3a7bff; --btn2:#1f5ae8; --navy:#060b20; --hero1:#0a2d8c; --hero2:#1a5fe0;
  --shadow:0 6px 24px rgba(0,0,0,.35); --bad:#ff8a8a; color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 var(--font-body);
  padding:calc(var(--hh,0px) + env(safe-area-inset-top,0px)) 0 var(--fh,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--link);outline-offset:2px;border-radius:8px}
#app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.wrap{max-width:none;margin:0;flex:1;display:flex;flex-direction:column}
main#root{flex:1 0 auto;width:100%;max-width:1120px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px)) 28px}
:root{--gutter:max(16px,calc((100% - 1120px)/2),env(safe-area-inset-left,0px))}
svg{display:block}

/* Header */
.top{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:30;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px 16px;
  background:var(--surface);border:0;border-bottom:1px solid var(--line);border-radius:0;padding:10px var(--gutter);box-shadow:var(--shadow)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:46px;height:34px;flex:none}
.brand b{display:block;font:800 18px/1.05 var(--font-display);letter-spacing:-.02em}
.brand small{display:block;font-size:10.5px;font-weight:600;color:var(--link);margin-top:3px;white-space:nowrap}
.nav{display:flex;flex-wrap:wrap;justify-content:center;gap:4px}
.nav a,.nav .catbtn{display:inline-flex;align-items:center;gap:6px;border:0;background:none;padding:8px 13px;border-radius:999px;font:600 13.5px var(--font-display)}
.nav a:hover,.nav .catbtn:hover{background:var(--surface2)}
.nav a.on,.nav .catbtn.on{background:linear-gradient(180deg,var(--btn1),var(--btn2));color:#fff}
.nav svg{width:15px;height:15px}
.cat{position:relative}
.menu{position:absolute;top:calc(100% + 8px);left:0;min-width:170px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:6px;z-index:50}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:9px;font:500 14px var(--font-body)}
.menu button:hover,.menu button[aria-current="true"]{background:var(--surface2);color:var(--link);font-weight:600}
.search{display:flex;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:0 6px 0 14px;width:250px}
.search input{flex:1;min-width:0;border:0;background:none;color:var(--fg);font:14px var(--font-body);padding:9px 0;outline:none}
.search input::placeholder{color:var(--muted)}
.search:focus-within{outline:3px solid var(--link);outline-offset:1px}
.search button{border:0;background:none;display:grid;place-items:center;width:34px;height:34px;color:var(--link)}
.search svg{width:19px;height:19px}

/* Banner */
.hero{position:relative;overflow:hidden;margin-top:16px;border-radius:24px;color:#fff;padding:44px 44px 56px;
  background:linear-gradient(115deg,var(--hero1),var(--hero2));display:grid;grid-template-columns:1.1fr .9fr;gap:12px;align-items:center}
.hero::after{content:"";position:absolute;right:-90px;bottom:-140px;width:420px;height:420px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero-copy{position:relative;z-index:1;min-width:0}
.hero h1{margin:0;font:800 clamp(28px,4.6vw,46px)/1.1 var(--font-display);letter-spacing:-.025em;text-wrap:balance}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{margin:14px 0 22px;font-size:clamp(15px,1.9vw,18px);max-width:34ch;color:rgba(255,255,255,.92)}
.cta{display:inline-flex;align-items:center;gap:10px;border:0;background:var(--accent);color:var(--accent-fg);font:700 15px var(--font-display);padding:13px 22px;border-radius:999px;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.cta:hover{filter:brightness(1.05)}
.cta svg{width:18px;height:18px}
.hero-art{position:relative;z-index:1;justify-self:end;width:100%;max-width:400px}
.dots{position:absolute;left:44px;bottom:22px;display:flex;gap:8px;z-index:2}
.dots button{width:10px;height:10px;padding:0;border:0;border-radius:99px;background:rgba(255,255,255,.5)}
.dots button[aria-current="true"]{background:#fff;width:24px}
.fade{animation:fade .4s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* Daftar aplikasi */
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:34px 0 16px}
.sec-head h2{margin:0;font:800 clamp(22px,3vw,28px)/1.2 var(--font-display);border-left:4px solid var(--btn2);padding-left:12px;letter-spacing:-.01em}
.pill{border:0;background:var(--surface2);color:var(--link);font:600 13px var(--font-display);padding:9px 16px;border-radius:999px;display:inline-flex;align-items:center;gap:6px}
.pill:hover{filter:brightness(.97)}
.pill svg{width:15px;height:15px}
.apps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.card{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 14px 14px;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.ico{display:block;width:76px;height:76px}
.ico svg{width:100%;height:100%}
.card b{font:700 15px/1.25 var(--font-display);margin-top:4px;overflow-wrap:anywhere}
.meta{display:flex;align-items:center;justify-content:center;gap:8px;color:var(--muted);font-size:12.5px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.meta i{width:1px;height:12px;background:var(--line)}
.meta svg{width:14px;height:14px;display:inline-block;vertical-align:-2px;margin-right:3px}
.dl{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;margin-top:6px;padding:9px 10px;border-radius:10px;color:#fff;font:600 13.5px var(--font-display);background:linear-gradient(180deg,var(--btn1),var(--btn2))}
.dl svg{width:15px;height:15px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 12px;background:var(--surface);border:1px dashed var(--line);border-radius:18px}

/* Detail */
.crumb{display:flex;align-items:center;gap:8px;margin:20px 4px 14px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.crumb a{color:var(--link);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.crumb svg{width:16px;height:16px}
.detail{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:30px;box-shadow:var(--shadow)}
.d-top{display:flex;gap:26px;align-items:center}
.d-top .ico{width:150px;height:150px;flex:none}
.d-top h1{margin:0;font:800 clamp(30px,4.4vw,42px)/1.1 var(--font-display);letter-spacing:-.025em}
.d-tag{margin:6px 0 16px;font:700 clamp(16px,2vw,20px)/1.3 var(--font-display);color:var(--muted)}
.facts{display:flex;flex-wrap:wrap;gap:14px 0}
.fact{display:flex;align-items:center;gap:10px;padding:0 22px;border-left:1px solid var(--line)}
.fact:first-child{padding-left:0;border-left:0}
.fact svg{width:28px;height:28px;color:var(--btn2);flex:none}
.fact small{display:block;font-size:13px;color:var(--muted);line-height:1.2}
.fact b{display:block;font:700 16px/1.3 var(--font-display);font-variant-numeric:tabular-nums}
.d-dl{display:flex;flex-direction:column;align-items:center;gap:10px;margin:28px 0 22px}
.big{display:inline-flex;align-items:center;justify-content:center;gap:12px;min-width:min(100%,340px);padding:16px 30px;border-radius:16px;color:#fff;font:700 19px var(--font-display);background:linear-gradient(180deg,var(--btn1),var(--btn2));box-shadow:0 8px 20px rgba(20,80,220,.3)}
.big:hover{filter:brightness(1.06)}
.big svg{width:24px;height:24px}
.big{position:relative;overflow:hidden;border:0;cursor:pointer}
.big .bt{position:relative;z-index:1;display:inline-flex;align-items:center;gap:12px}
.big .fill{position:absolute;top:0;bottom:0;left:0;width:0;background:rgba(255,255,255,.28)}
.big.busy{pointer-events:none}
.big.busy .fill{width:40%;animation:dlslide 1.1s ease-in-out infinite}
.big.done{background:linear-gradient(180deg,#22a45d,#15803d)}
.big.done .fill{animation:none;width:0}
@keyframes dlslide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@media (prefers-reduced-motion:reduce){.big.busy .fill{animation:none;width:100%}}
.hint{margin:0;font-size:13.5px;color:var(--muted);text-align:center}
.bar{display:flex;align-items:center;gap:12px;background:var(--surface2);border-radius:12px;padding:13px 16px;margin-top:8px}
.bar svg{width:26px;height:26px;color:var(--btn2);flex:none}
.bar h2{margin:0;font:700 18px var(--font-display)}
.d-body{padding:16px 6px 0}
.d-body p{margin:0 0 14px;font-size:16.5px;max-width:70ch}
.d-body h3{margin:18px 0 10px;font:700 18px var(--font-display);color:var(--link)}
.feats{list-style:none;margin:0 0 20px;padding:0;display:grid;gap:10px}
.feats li{display:flex;align-items:center;gap:12px;font-size:16px}
.feats svg{width:22px;height:22px;flex:none;color:var(--btn2)}
.note{display:flex;gap:14px;align-items:flex-start;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.note svg{width:26px;height:26px;color:var(--btn2);flex:none;margin-top:2px}
.note b{display:block;font:700 16px var(--font-display);color:var(--link)}
.note span{font-size:15px}

/* Halaman teks */
.prose{background:var(--surface);border:1px solid var(--line);border-radius:26px;padding:30px;margin-top:20px;box-shadow:var(--shadow)}
.prose h1{margin:0 0 14px;font:800 clamp(26px,4vw,36px)/1.15 var(--font-display);letter-spacing:-.02em}
.prose h2{margin:22px 0 6px;font:700 18px var(--font-display);color:var(--link)}
.prose p{margin:0 0 10px;max-width:68ch}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;background:var(--surface2);padding:2px 7px;border-radius:6px;user-select:all}

/* Footer */
.foot{position:relative;position:fixed;left:0;right:0;bottom:0;z-index:30;margin:0;background:var(--navy);color:var(--navy-fg);border-radius:0;padding:22px var(--gutter) calc(22px + env(safe-area-inset-bottom,0px))}
.f-row{position:relative;display:grid;grid-template-columns:auto 1fr auto;gap:18px 28px;align-items:center}
.foot .brand b{color:#fff}
.foot .brand small{color:#8fb3ff}
.f-tag{margin:0;font-size:14px;max-width:30ch;border-left:1px solid rgba(255,255,255,.18);padding-left:28px}
.social{display:flex;align-items:center;gap:10px}
.social span{font-size:13px;font-weight:600;margin-right:4px}
.social a{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.1);color:#fff}
.social a:hover{background:rgba(255,255,255,.2)}
.social svg{width:20px;height:20px}
.social:empty{display:none}
.foot .social{margin-bottom:16px}
.f-bot{position:relative;display:flex;justify-content:space-between;gap:10px 24px;flex-wrap:wrap;font-size:12.5px}
.f-bot nav{display:flex;gap:16px;flex-wrap:wrap}
.f-bot a:hover{text-decoration:underline}

.toast{position:fixed;left:50%;bottom:calc(var(--fh,0px) + 20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;max-width:min(92vw,420px);
  background:var(--navy);color:#fff;border-radius:14px;padding:12px 18px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.3);text-align:center}

@media (max-width:960px){.apps{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:860px){
  .top{grid-template-columns:1fr auto}
  .nav{grid-column:1/-1;grid-row:2;justify-content:flex-start}
  .search{width:min(250px,48vw)}
  .f-row{grid-template-columns:1fr}
  .f-tag{border-left:0;padding-left:0}
}
@media (max-width:700px){
  .apps{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .hero{grid-template-columns:1fr;padding:28px 22px 52px}
  .hero-art{justify-self:center;max-width:300px}
  .dots{left:22px}
  .detail,.prose{padding:20px}
  .d-top{flex-direction:column;align-items:flex-start;gap:16px}
  .d-top .ico{width:110px;height:110px}
  .fact{padding:0 14px}
  .search{width:100%;grid-column:1/-1}
  .brand small{white-space:normal}
}
@media (max-width:420px){.card{padding:14px 10px 12px}.ico{width:64px;height:64px}.fact{padding:0 10px}.fact:first-child{padding-left:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Portal admin */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:10px;padding:9px 16px;font:600 13.5px var(--font-display);color:#fff;background:linear-gradient(180deg,var(--btn1),var(--btn2));cursor:pointer;position:relative}
.btn svg{width:15px;height:15px}
.btn.ghost{background:var(--surface2);color:var(--link);border-color:var(--line)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.55;cursor:wait}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
label:focus-within .sr+*{outline:none}
.btn:has(.sr:focus-visible),.thumb.add:has(.sr:focus-visible){outline:3px solid var(--link);outline-offset:2px}
.adm-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:22px 0 10px}
.adm-top h1,.adm-h{margin:0;font:800 clamp(24px,3.4vw,32px)/1.15 var(--font-display);letter-spacing:-.02em}
.adm-note{color:var(--muted);font-size:14px;margin:0 0 16px;max-width:72ch}
.adm-list{display:grid;gap:10px}
.adm-row{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;flex-wrap:wrap}
.adm-row .ico{width:52px;height:52px;flex:none}
.adm-info{flex:1;min-width:180px}
.adm-info b{display:block;font:700 16px var(--font-display);overflow-wrap:anywhere}
.adm-info span{font-size:13px;color:var(--muted)}
.adm-act{display:flex;gap:8px;flex-wrap:wrap}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px;margin-top:16px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f.full{grid-column:1/-1}
.f>span{font:600 13px var(--font-display)}
.f small{color:var(--muted);font-size:12.5px}
.f input,.f textarea{width:100%;font:15px var(--font-body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.f textarea{resize:vertical;min-height:96px}
.f input:focus,.f textarea:focus{outline:3px solid var(--link);outline-offset:1px}
.f .f{gap:6px}
.media{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.media .ico{width:84px;height:84px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.thumb{position:relative;border-radius:10px;overflow:hidden;border:1px solid var(--line);aspect-ratio:16/10;background:var(--surface2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;font-size:18px;line-height:1;padding:0}
.thumb.add{display:grid;place-items:center;border-style:dashed;cursor:pointer;color:var(--link);font:600 13px var(--font-display);text-align:center}
.thumb.add span{display:flex;flex-direction:column;align-items:center;gap:4px}
.thumb.add svg{width:20px;height:20px}
.ferr{color:var(--bad);font-weight:600;margin:12px 0 0;min-height:1.4em}
.form-act{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.form-act .btn{padding:12px 22px;font-size:15px}
.shots{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;padding:14px 4px 10px;margin-bottom:6px}
.shot{flex:none;padding:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface2);scroll-snap-align:start;cursor:zoom-in}
.shot img{display:block;height:200px;width:auto;max-width:none}
.lightbox{position:fixed;inset:0;z-index:70;background:rgba(5,10,30,.94);display:grid;place-items:center;padding:12px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.lightbox img{max-width:100%;max-height:100%;border-radius:10px;object-fit:contain;transform-origin:center center;will-change:transform;touch-action:none;-webkit-user-drag:none;user-select:none;cursor:grab}
.lightbox img.grabbing{cursor:grabbing}
.lb-tools{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(255,255,255,.16);backdrop-filter:blur(6px)}
.lb-btn{min-width:42px;height:38px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:#fff;font:600 18px/1 inherit;font-family:inherit;cursor:pointer}
.lb-btn:active{background:rgba(255,255,255,.2)}
.lb-x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.18);color:#fff;font-size:26px;line-height:1}
.ico img{width:100%;height:100%;object-fit:cover;border-radius:22%;display:block}
@media (max-width:700px){.fgrid{grid-template-columns:1fr}.shot img{height:160px}}

/* Hak cipta satu baris */
.f-bot span{white-space:nowrap;font-size:clamp(10px,3vw,12.5px)}
.f-bot nav{gap:6px 16px}

/* Tampilan isi lebih ringkas di HP */
@media (max-width:700px){
  body{font-size:13px}

.top{padding:6px var(--gutter);gap:2px 12px}
.brand{gap:8px}

@media (max-width:700px){

var CFG_KEY='gts-github';
function cfg(){try{return JSON.parse(localStorage.getItem(CFG_KEY)||'{}')||{}}catch(e){return {}}}

function hasToken(){var c=cfg();return !!(c.token&&c.owner&&c.repo)}
function guessRepo(){
  var h=location.hostname,p=location.pathname.split('/').filter(Boolean);
  if(/\.github\.io$/i.test(h)){
    var o=h.replace(/\.github\.io$/i,'');
    return {owner:o,repo:(p[0]&&p[0].indexOf('.')<0)?p[0]:o+'.github.io'};
  }
  return {owner:'',repo:''};
}

  var a=document.createElement('a');a.href=url;a.rel='noopener noreferrer';

/* ---------- GitHub API ---------- */
function gh(path,opt){
  var c=cfg();opt=opt||{};
  var h={'Accept':'application/vnd.github+json','Authorization':'Bearer '+c.token,'X-GitHub-Api-Version':'2022-11-28'};
  if(opt.body)h['Content-Type']='application/json';
  return fetch('https://api.github.com'+path,{method:opt.method||'GET',headers:h,body:opt.body?JSON.stringify(opt.body):undefined,cache:'no-store'}).then(function(r){
    if(r.ok)return r.status===204?null:r.json();
    return r.json().catch(function(){return {}}).then(function(j){var e=new Error(j.message||('HTTP '+r.status));e.status=r.status;throw e});
  });
}
function repoBase(){var c=cfg();return '/repos/'+encodeURIComponent(c.owner)+'/'+encodeURIComponent(c.repo)}
function repoData(){
  var c=cfg();
  return fetch('https://api.github.com'+repoBase()+'/contents/apps.json?ref='+encodeURIComponent(c.branch||'main'),
    {cache:'no-store',headers:{'Accept':'application/vnd.github.raw+json','Authorization':'Bearer '+c.token,'X-GitHub-Api-Version':'2022-11-28'}}).then(function(r){
    if(!r.ok){var e=new Error('HTTP '+r.status);e.status=r.status;throw e}
    return r.text();
  }).then(function(t){var d=JSON.parse(t);if(!d.apps)d.apps=[];if(!d.site)d.site={};return d});
}
function imgPaths(d){
  var s=[];
  (d.apps||[]).forEach(function(a){
    if(/^img\//.test(a.iconImg||''))s.push(a.iconImg);
    (a.shots||[]).forEach(function(x){if(/^img\//.test(x))s.push(x)});
  });
  return s;
}
/* Satu commit berisi data baru, gambar baru, dan penghapusan gambar lama. */
async function commit(op,message){
  /* Jika GitHub menolak karena ada perubahan lain (409/422), baca ulang data terbaru lalu ulangi otomatis. */
  for(var n=1;;n++){
    try{return await commitOnce(op,message)}
    catch(e){
      if(n>=4||!e||(e.status!==409&&e.status!==422))throw e;
      await new Promise(function(r){setTimeout(r,600*n)});
    }
  }
}
async function commitOnce(op,message){
  var c=cfg(),branch=c.branch||'main',base=repoBase();
  var latest=await repoData();
  var disp=op(clone(latest));
  var next=clone(disp),files=[];
  next.apps.forEach(function(a){
    if(/^data:image\//.test(a.iconImg||'')){var p='img/'+a.id+'-ikon-'+rand()+'.png';files.push({path:p,b64:a.iconImg.split(',')[1]});a.iconImg=p}
    a.shots=(a.shots||[]).map(function(s){
      if(/^data:image\//.test(s)){var p='img/'+a.id+'-'+rand()+'.jpg';files.push({path:p,b64:s.split(',')[1]});return p}
      return s;
    });
  });
  var keep=imgPaths(next),del=imgPaths(latest).filter(function(p){return keep.indexOf(p)<0});
  var ref=await gh(base+'/git/ref/heads/'+encodeURI(branch));
  var head=ref.object.sha;
  var hc=await gh(base+'/git/commits/'+head);
  var entries=[];
  for(var i=0;i<files.length;i++){
    var b=await gh(base+'/git/blobs',{method:'POST',body:{content:files[i].b64,encoding:'base64'}});
    entries.push({path:files[i].path,mode:'100644',type:'blob',sha:b.sha});
  }
  var jb=await gh(base+'/git/blobs',{method:'POST',body:{content:JSON.stringify(next,null,2)+'\n',encoding:'utf-8'}});
  entries.push({path:'apps.json',mode:'100644',type:'blob',sha:jb.sha});
  var tree;
  try{
    tree=await gh(base+'/git/trees',{method:'POST',body:{base_tree:hc.tree.sha,tree:entries.concat(del.map(function(p){return {path:p,mode:'100644',type:'blob',sha:null}}))}});
  }catch(e){
    if(!del.length)throw e;
    tree=await gh(base+'/git/trees',{method:'POST',body:{base_tree:hc.tree.sha,tree:entries}});
  }
  var nc=await gh(base+'/git/commits',{method:'POST',body:{message:message,tree:tree.sha,parents:[head]}});
  await gh(base+'/git/refs/heads/'+encodeURI(branch),{method:'PATCH',body:{sha:nc.sha}});
  return disp;
}
function errMsg(e){
  var s=e&&e.status;
  if(s===401)return 'Token ditolak atau sudah kedaluwarsa. Buat token baru di GitHub lalu hubungkan ulang.';
  if(s===403)return 'Token tidak punya izin menulis ke repo ini. Pastikan izin Contents diatur ke Read and write.';
  if(s===404)return 'Repo, branch, atau file apps.json tidak ditemukan. Periksa Pengaturan GitHub.';
  if(s===409||s===422)return 'Terjadi bentrok saat menyimpan. Muat ulang halaman lalu coba lagi.';
  return 'Gagal menyimpan. Periksa koneksi internet lalu coba lagi.';
}

function persist(op,msg,message,onFail){
  if(saving)return;
  saving=true;setBusy(true);
  commit(op,message||'Perbarui data Genesis Tech Store').then(function(disp){
    saving=false;DATA=disp;APPS=disp.apps;buildMenu();renderSocial();setBusy(false);
    toast(msg+' Web akan diperbarui dalam sekitar 1 sampai 2 menit.',7000);
    if(location.hash!=='#admin')location.hash='admin';else route();
  }).catch(function(e){saving=false;setBusy(false);toast(errMsg(e),6500);if(onFail)onFail()});
}

function readImg(file,max,mime,qual){
  return new Promise(function(res,rej){
    if(!/^image\//.test(file.type)){rej(new Error('bukan gambar'));return}
    var fr=new FileReader();
    fr.onerror=function(){rej(new Error('gagal baca'))};
    fr.onload=function(){
      var im=new Image();
      im.onerror=function(){rej(new Error('gagal muat'))};
      im.onload=function(){
        var w=im.naturalWidth||im.width,h=im.naturalHeight||im.height;
        if(!w||!h){rej(new Error('ukuran 0'));return}
        var k=Math.min(1,max/Math.max(w,h)),cw=Math.max(1,Math.round(w*k)),ch=Math.max(1,Math.round(h*k));
        var c=document.createElement('canvas');c.width=cw;c.height=ch;var x=c.getContext('2d');
        if(mime==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,cw,ch)}
        x.drawImage(im,0,0,cw,ch);
        res(c.toDataURL(mime,qual));
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function onIcon(e){
  var f=e.target.files[0];e.target.value='';if(!f)return;
  readImg(f,192,'image/png').then(function(u){draft.iconImg=u;ferr('');renderMedia()},function(){ferr('Ikon tidak bisa dibaca. Pakai gambar PNG, JPG atau WebP.')});
}
function onShots(e){

    ferr(ok.length<fl.length?'Sebagian gambar tidak bisa dibaca dan dilewati.':'');renderMedia();

}

function uniqueId(list,name){
  var base=name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')||'app',id=base,n=2;
  var has=function(x){return list.some(function(a){return a.id===x})};
  while(has(id))id=base+'-'+(n++);
  return id;
}
function fmtBytes(n){
  if(n<1024*1024)return Math.max(1,Math.round(n/1024))+' KB';
  if(n<1024*1024*1024){var m=n/1048576;return (m<10?m.toFixed(1).replace(/\.0$/,''):Math.round(m))+' MB'}
  return (n/1073741824).toFixed(1).replace(/\.0$/,'')+' GB';
}
function extOf(name){var m=String(name||'').toLowerCase().match(/\.(exe|msi|apk|aab|ipa|zip|rar|7z|dmg|pkg|deb|rpm|appimage|iso|pdf|tar\.gz)$/);return m?'.'+m[1]:''}
function verOf(text){var m=String(text||'').match(/(?:^|[^0-9a-z])v?(\d+(?:\.\d+){1,3})(?![0-9])/i);return m?'v'+m[1]:''}
function setAuto(id,val){var e=$('#'+id);if(e&&val){e.value=val;return true}return false}
function autoNote(t){var e=$('#autonote');if(e)e.textContent=t||''}
/* Ambil ikon utama dari file .exe (Windows PE). Hanya bagian header dan resource yang dibaca. */
async function exeIcon(file){
  var head=await file.slice(0,Math.min(file.size,65536)).arrayBuffer();
  var v=new DataView(head);
  if(v.byteLength<64||v.getUint16(0,true)!==0x5A4D)return null;
  var pe=v.getUint32(60,true);
  if(pe+24>v.byteLength||v.getUint32(pe,true)!==0x00004550)return null;
  var nsec=v.getUint16(pe+6,true),osz=v.getUint16(pe+20,true),opt=pe+24,magic=v.getUint16(opt,true);
  var dd=opt+(magic===0x20b?112:96);
  if(dd+24>v.byteLength)return null;
  var rrva=v.getUint32(dd+16,true),rsize=v.getUint32(dd+20,true);
  if(!rrva||!rsize)return null;
  var st=opt+osz,sec=null;
  for(var i=0;i<nsec;i++){
    var o=st+i*40;if(o+40>v.byteLength)break;
    var vs=v.getUint32(o+8,true),va=v.getUint32(o+12,true),rs=v.getUint32(o+16,true),rp=v.getUint32(o+20,true);
    if(rrva>=va&&rrva<va+Math.max(vs,rs)){sec={va:va,rs:rs,rp:rp};break}
  }
  if(!sec||sec.rs>268435456)return null;
  var rbuf=await file.slice(sec.rp,sec.rp+sec.rs).arrayBuffer();
  var r=new DataView(rbuf),base=rrva-sec.va;   /* posisi awal resource di dalam buffer */
  function dir(off){
    if(off<0||off+16>r.byteLength)return [];
    var n=r.getUint16(off+12,true)+r.getUint16(off+14,true),a=[];
    for(var k=0;k<n&&off+16+k*8+8<=r.byteLength;k++){
      var id=r.getUint32(off+16+k*8,true),to=r.getUint32(off+16+k*8+4,true);
      a.push({id:id&0x80000000?-1:id,sub:!!(to&0x80000000),off:base+(to&0x7fffffff)});
    }
    return a;
  }
  function leaf(e){   /* turun sampai data (abaikan bahasa) */
    var guard=0;while(e&&e.sub&&guard++<4){var d=dir(e.off);e=d[0]}
    if(!e||e.sub||e.off+8>r.byteLength)return null;
    var rva=r.getUint32(e.off,true),sz=r.getUint32(e.off+4,true),p=rva-sec.va;
    if(p<0||p+sz>r.byteLength||sz<1)return null;
    return new Uint8Array(rbuf,p,sz);
  }
  var top=dir(base),grp=null,ico={};
  top.forEach(function(e){if(e.id===14)grp=e;if(e.id===3)ico=e});
  if(!grp||!ico.sub)return null;
  var gdata=leaf(dir(grp.off)[0]);
  if(!gdata||gdata.length<6)return null;
  var gv=new DataView(gdata.buffer,gdata.byteOffset,gdata.byteLength),cnt=gv.getUint16(4,true),best=null;
  for(var j=0;j<cnt&&6+j*14+14<=gdata.length;j++){
    var q=6+j*14,w=gv.getUint8(q)||256,bits=gv.getUint16(q+6,true),id=gv.getUint16(q+12,true);
    var score=w*100+bits;
    if(!best||score>best.score)best={score:score,id:id,w:w,h:gv.getUint8(q+1)||256,bits:bits,colors:gv.getUint8(q+2)};
  }
  if(!best)return null;
  var ent=dir(ico.off).filter(function(e){return e.id===best.id})[0];
  var img=leaf(ent);
  if(!img)return null;
  var out=new Uint8Array(22+img.length),ov=new DataView(out.buffer);
  ov.setUint16(2,1,true);ov.setUint16(4,1,true);
  out[6]=best.w>=256?0:best.w;out[7]=best.h>=256?0:best.h;out[8]=best.colors;
  ov.setUint16(10,1,true);ov.setUint16(12,best.bits||32,true);
  ov.setUint32(14,img.length,true);ov.setUint32(18,22,true);
  out.set(img,22);
  return new Blob([out],{type:'image/x-icon'});
}
function onAppFile(e){
  var f=e.target.files[0];e.target.value='';if(!f)return;
  if(extOf(f.name)!=='.exe'){autoNote('Ikon hanya bisa diambil dari file .exe. Untuk format lain, pakai tombol Pilih ikon di bawah.');return}
  autoNote('Membaca ikon...');
  exeIcon(f).then(function(blob){
    if(!blob){autoNote('File ini tidak punya ikon yang bisa dibaca. Pakai tombol Pilih ikon di bawah.');return}
    return readImg(blob,192,'image/png').then(function(u){draft.iconImg=u;renderMedia();autoNote('Ikon berhasil diambil dari file.')});
  }).catch(function(){autoNote('Ikon tidak bisa dibaca. Pakai tombol Pilih ikon di bawah.')});
}
/* Dari link download: format dari akhiran file; untuk link GitHub Releases juga versi (tag) dan ukuran. */
function onUrlAuto(){
  var u=($('#f-url').value||'').trim();if(!/^https?:\/\//i.test(u))return;
  var path=u.split(/[?#]/)[0],got=[];
  var x=extOf(decodeURIComponent(path.split('/').pop()||''));
  if(x&&setAuto('f-fmt',x))got.push('format');
  var m=path.match(/^https:\/\/github\.com\/([^/]+)\/([^/]+)\/releases\/download\/([^/]+)\/([^/]+)$/i);
  if(m){
    var tag=decodeURIComponent(m[3]),fname=decodeURIComponent(m[4]);
    if(setAuto('f-ver',verOf(tag)||verOf(fname)))got.push('versi');
    fetch('https://api.github.com/repos/'+m[1]+'/'+m[2]+'/releases/tags/'+encodeURIComponent(tag),{cache:'no-store',headers:{'Accept':'application/vnd.github+json'}})
      .then(function(r){return r.ok?r.json():null}).then(function(j){
        if(!j||!j.assets)return;
        var a=j.assets.filter(function(z){return z.name===fname})[0];
        if(a&&setAuto('f-size',fmtBytes(a.size)))autoNote('Terisi dari link GitHub Releases: ukuran'+(got.length?', '+got.join(', '):'')+'.');
      }).catch(function(){});
  }
  if(got.length)autoNote('Terisi dari link: '+got.join(', ')+'.');
}
function bindForm(){
  renderMedia();
  $('#f-appfile').addEventListener('change',onAppFile);
  $('#f-url').addEventListener('change',onUrlAuto);
  $('#m-icon').addEventListener('click',function(e){if(e.target.closest('[data-rm-icon]')){draft.iconImg='';renderMedia()}});
  $('#m-shots').addEventListener('click',function(e){var b=e.target.closest('[data-rm]');if(b){draft.shots.splice(+b.dataset.rm,1);renderMedia()}});
  $('#appform').addEventListener('submit',function(e){
    e.preventDefault();
    var v=readForm();
    if(!v.name){ferr('Nama aplikasi wajib diisi.');$('#f-name').focus();return}
    if(v.url&&!safeUrl(v.url)){ferr('Link download harus diawali http:// atau https://');$('#f-url').focus();return}
    var app=Object.assign({},draft,v),wasEditing=editing;
    persist(function(d){
      if(wasEditing){
        var found=false;
        d.apps=d.apps.map(function(x){if(x.id===app.id){found=true;return app}return x});
        if(!found)d.apps.unshift(app);
      }else{
        app.id=uniqueId(d.apps,v.name);d.apps.unshift(app);
      }
      return d;
    },'Tersimpan.',(wasEditing?'Ubah aplikasi: ':'Tambah aplikasi: ')+v.name);
  });
}

function bindConnect(){
  var f=$('#cform');
  f.addEventListener('submit',function(e){
    e.preventDefault();
    var g=function(i){return $('#'+i).value.trim()};
    var next={owner:g('f-owner'),repo:g('f-repo'),branch:g('f-branch')||'main',token:g('f-token')},old=cfg();
    if(!next.owner||!next.repo||!next.token){ferr('Akun, nama repo, dan token wajib diisi.');return}
    saveCfg(next);setBusy(true);ferr('Memeriksa koneksi...');
    var fail=function(m){old.token?saveCfg(old):clearCfg();setBusy(false);ferr(m)};
    gh(repoBase()).then(function(r){
      if(!(r.permissions&&r.permissions.push)){fail('Token terbaca, tapi tidak punya izin menulis. Atur izin Contents ke Read and write.');return}
      return repoData().then(function(){
        setBusy(false);toast('Terhubung ke '+next.owner+'/'+next.repo+'.');location.hash='admin';route();
      },function(e){fail(e.status===404?'File apps.json tidak ditemukan di repo. Unggah dulu isi folder dari paket.':errMsg(e))});
    },function(e){fail(e.status===401?'Token ditolak. Periksa token yang ditempel.':e.status===404?'Repo tidak ditemukan atau token tidak punya akses ke repo ini.':errMsg(e))});
  });
  var d=$('#disc');

function setSlide(i){
  slide=(i+SLIDES.length)%SLIDES.length;
  var h=$('#sh'),p=$('#sp');if(!h)return;
  h.innerHTML=SLIDES[slide].h;p.textContent=SLIDES[slide].p;
  [h,p].forEach(function(e){e.classList.remove('fade');void e.offsetWidth;e.classList.add('fade')});
  var d=$('#dots');d.innerHTML=SLIDES.map(function(_,n){return '<button aria-label="Slide '+(n+1)+'"'+(n===slide?' aria-current="true"':'')+' data-i="'+n+'"></button>'}).join('');
}
function toast(msg,ms){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},ms||4200)}

function goHome(then){
  var h=location.hash.slice(1);
  if(h===''||h==='beranda'){route();if(then)then()}
  else{location.hash='beranda';if(then)setTimeout(then,60)}
}
function route(){
  var h=location.hash.slice(1),m,app=null,view,html='',after=null;
  clearInterval(timer);curApp=null;
  if(!loaded){
    view='loading';
    html=loadError?box('<h1>Data belum bisa dimuat</h1><p>'+esc(loadError)+'</p>'):box('<p>Memuat...</p>');
  }else if(h==='admin'||h==='admin-github'||h==='admin-baru'||h.indexOf('admin-edit-')===0){
    view=h;
    if(h==='admin-github'||!hasToken()){html=connectHTML();view='admin-github';after=bindConnect}
    else if(h==='admin'){html=adminListHTML();after=bindSite}
    else{
      var ed=h==='admin-baru'?null:byId(h.slice(11));
      if(h!=='admin-baru'&&!ed){html=adminListHTML();view='admin';after=bindSite}
      else{draft=ed?clone(ed):blank();editing=!!ed;html=formHTML();after=bindForm}
    }
  }else if((m=h.match(/^app-([a-z0-9-]+)$/))){
    app=byId(m[1]);
    if(app){view='app-'+app.id;html=detailHTML(app);curApp=app}
    else{view='home';html=homeHTML()}
  }else if(h==='tentang'||h==='bantuan'||h==='privasi'){view=h;html=proseHTML(h)}
  else{view='home';html=homeHTML()}
  root.innerHTML=html;
  $('#n-home').classList.toggle('on',view==='home');
  $('#n-about').classList.toggle('on',view==='tentang');
  $('#n-help').classList.toggle('on',view==='bantuan');
  $('#n-admin').classList.toggle('on',view.indexOf('admin')===0);
  document.title=app?app.name+' | Genesis Tech Store':'Genesis Tech Store';
  if(view!==lastView)window.scrollTo(0,0);
  lastView=view;
  if(view==='home'){setSlide(0);if(!reduce)timer=setInterval(function(){setSlide(slide+1)},5500)}
  if(app){
    var b=$('#bigdl');
    if(b)b.addEventListener('click',function(){
      if(!b.dataset.dl){toast('Link download '+app.name+' belum tersedia.');return}
      startDownload(b,b.dataset.dl);
    });
  }
  if(after)after();
}

/* ===== Zoom gambar pratinjau (cubit 2 jari, geser, ketuk 2x, roda mouse) ===== */
var Z={s:1,x:0,y:0,max:6,pts:{},d0:0,s0:1,mx:0,my:0,moved:false,tapT:0,sx:0,sy:0,tgt:null};
function lbApply(){var im=$('#lbimg');if(im)im.style.transform='translate('+Z.x+'px,'+Z.y+'px) scale('+Z.s+')'}
function lbReset(){Z.s=1;Z.x=0;Z.y=0;Z.pts={};Z.moved=false;lbApply()}
function lbClamp(){
  var im=$('#lbimg'),lb=$('#lb');
  if(Z.s<=1.001){Z.s=1;Z.x=0;Z.y=0;return}
  var mx=Math.max(0,(im.offsetWidth*Z.s-lb.clientWidth)/2)+40,
      my=Math.max(0,(im.offsetHeight*Z.s-lb.clientHeight)/2)+40;
  Z.x=Math.max(-mx,Math.min(mx,Z.x));Z.y=Math.max(-my,Math.min(my,Z.y));
}
function zoomAt(ns,fx,fy){
  ns=Math.max(1,Math.min(Z.max,ns));var k=ns/Z.s;
  Z.x=fx-(fx-Z.x)*k;Z.y=fy-(fy-Z.y)*k;Z.s=ns;lbClamp();lbApply();
}
function lbRel(cx,cy){var r=$('#lb').getBoundingClientRect();return{x:cx-r.left-r.width/2,y:cy-r.top-r.height/2}}
function lbPts(){return Object.keys(Z.pts).map(function(k){return Z.pts[k]})}
document.addEventListener('pointerdown',function(e){
  var lb=e.target.closest&&e.target.closest('#lb');
  if(!lb||lb.hidden||e.target.closest('.lb-btn,.lb-x'))return;
  Z.pts[e.pointerId]={x:e.clientX,y:e.clientY};
  var ps=lbPts();
  if(ps.length===1){Z.moved=false;Z.sx=e.clientX;Z.sy=e.clientY;Z.tgt=e.target}
  else if(ps.length===2){
    Z.d0=Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y)||1;Z.s0=Z.s;
    Z.mx=(ps[0].x+ps[1].x)/2;Z.my=(ps[0].y+ps[1].y)/2;Z.moved=true;
  }
  if(Z.s>1)$('#lbimg').classList.add('grabbing');
},true);
document.addEventListener('pointermove',function(e){
  var p=Z.pts[e.pointerId];if(!p)return;
  var ps=lbPts();
  if(ps.length>=2){
    p.x=e.clientX;p.y=e.clientY;ps=lbPts();
    var d=Math.hypot(ps[0].x-ps[1].x,ps[0].y-ps[1].y)||1,
        mx=(ps[0].x+ps[1].x)/2,my=(ps[0].y+ps[1].y)/2;
    Z.x+=mx-Z.mx;Z.y+=my-Z.my;Z.mx=mx;Z.my=my;
    var f=lbRel(mx,my);zoomAt(Z.s0*d/Z.d0,f.x,f.y);
  }else{
    var dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
    if(Math.hypot(e.clientX-Z.sx,e.clientY-Z.sy)>6)Z.moved=true;
    if(Z.s>1){Z.x+=dx;Z.y+=dy;lbClamp();lbApply()}
  }
});
function lbUp(e){
  var p=Z.pts[e.pointerId];if(!p)return;
  var was=lbPts().length;delete Z.pts[e.pointerId];
  var im=$('#lbimg');if(im)im.classList.remove('grabbing');
  var rest=lbPts();
  if(rest.length===1){Z.sx=rest[0].x;Z.sy=rest[0].y;Z.moved=true}
  if(was!==1||Z.moved||e.type==='pointercancel')return;
  var onImg=Z.tgt&&Z.tgt.id==='lbimg',now=Date.now();
  if(onImg){
    if(now-Z.tapT<320){
      Z.tapT=0;
      if(Z.s>1)lbReset();else{var f=lbRel(e.clientX,e.clientY);zoomAt(2.5,f.x,f.y)}
    }else Z.tapT=now;
  }else{$('#lb').hidden=true}
}
document.addEventListener('pointerup',lbUp);
document.addEventListener('pointercancel',lbUp);
document.addEventListener('wheel',function(e){
  var lb=e.target.closest&&e.target.closest('#lb');if(!lb||lb.hidden)return;
  e.preventDefault();var f=lbRel(e.clientX,e.clientY);
  zoomAt(Z.s*(e.deltaY<0?1.18:1/1.18),f.x,f.y);
},{passive:false});
window.addEventListener('resize',function(){lbClamp();lbApply()});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){$('#lb').hidden=true}
});
window.addEventListener('hashchange',route);

route();
fetch('apps.json?v='+Date.now(),{cache:'no-store'}).then(function(r){
  if(!r.ok)throw new Error('HTTP '+r.status);
  return r.json();
}).then(function(d){
  DATA=d||{};if(!DATA.site)DATA.site={};if(!DATA.apps)DATA.apps=[];APPS=DATA.apps;
  loaded=true;buildMenu();renderSocial();route();syncFromRepo();
}).catch(function(){
  loadError=location.protocol==='file:'?'File apps.json tidak bisa dibaca saat halaman dibuka langsung dari komputer. Pasang di GitHub Pages atau Netlify, atau jalankan server lokal.':'File apps.json tidak ditemukan atau rusak. Pastikan file itu ada di folder yang sama dengan index.html.';
  route();
});
})();

</script>
</body>
</html>
